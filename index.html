<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тут ничего нету ^^</title>
    <!-- Подключение пиксельного шрифта в стиле Minecraft -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Текст поверх анимации */
        .overlay-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: clamp(14px, 3vw, 22px);
            letter-spacing: 0.15em;
            text-align: center;
            z-index: 1;
            pointer-events: none; /* чтобы не мешал взаимодействию с canvas */
            text-shadow: 0 0 12px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="overlay-text">тут ничего нету ^^</div>

    <script>
        (() => {
            const canvas = document.getElementById('scene');
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 90;          // количество точек
            const MAX_DISTANCE = 140;           // максимальное расстояние для линий
            const MIN_DISTANCE_FOR_LINE = 30;   // минимальное расстояние (чтобы не рисовать линии поверх самих точек)

            // Базовые параметры частиц
            const BASE_RADIUS = 2.5;            // радиус точки
            const BASE_SPEED = 0.6;             // базовая скорость

            let animationId;

            // Инициализация размеров холста
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            // Создание частиц
            function createParticles(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * BASE_SPEED * 2,
                        vy: (Math.random() - 0.5) * BASE_SPEED * 2,
                        radius: BASE_RADIUS + Math.random() * 1.5
                    });
                }
            }

            // Обновление позиций частиц (отскок от стен)
            function updateParticles() {
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;

                    // Отскок от границ
                    if (p.x < p.radius || p.x > width - p.radius) {
                        p.vx *= -1;
                        p.x = Math.max(p.radius, Math.min(width - p.radius, p.x));
                    }
                    if (p.y < p.radius || p.y > height - p.radius) {
                        p.vy *= -1;
                        p.y = Math.max(p.radius, Math.min(height - p.radius, p.y));
                    }
                }
            }

            // Рисование линий между близкими частицами
            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < MAX_DISTANCE && dist > MIN_DISTANCE_FOR_LINE) {
                            // Прозрачность зависит от расстояния: чем ближе, тем ярче
                            const opacity = 1 - dist / MAX_DISTANCE;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.25})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
            }

            // Рисование точек
            function drawParticles() {
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fill();
                }
            }

            // Главный цикл анимации
            function animate() {
                ctx.clearRect(0, 0, width, height);

                updateParticles();
                drawConnections();
                drawParticles();

                animationId = requestAnimationFrame(animate);
            }

            // Обработчик изменения размера окна
            function handleResize() {
                resizeCanvas();
                // Пересоздаём частицы, чтобы они не оказались за границами
                createParticles(PARTICLE_COUNT);
            }

            // Запуск
            resizeCanvas();
            createParticles(PARTICLE_COUNT);
            animate();

            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', handleResize);

            // Очистка при уходе со страницы (не обязательно, но хорошо)
            window.addEventListener('beforeunload', () => {
                if (animationId) cancelAnimationFrame(animationId);
            });
        })();
    </script>
</body>
</html>
